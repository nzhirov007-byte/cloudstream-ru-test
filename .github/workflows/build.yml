name: Build CloudStream RU Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['*.md']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build plugin
        run: |
          gradle make makePluginsJson -x ensureJarCompatibility
      - name: Publish builds branch
        run: |
          mkdir -p /tmp/cloudstream-builds
          find . -path '*/build/*.cs3' -exec cp {} /tmp/cloudstream-builds/ \;
          find . -path '*/build/*.jar' -exec cp {} /tmp/cloudstream-builds/ \;
          cp build/plugins.json /tmp/cloudstream-builds/plugins.json
          cd /tmp/cloudstream-builds
          git init
          git checkout -b builds
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Build $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin builds